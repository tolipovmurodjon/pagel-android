name: build

# The Oracle server is ARM and Android's build tools run only on x86, so CI is where PAGEL compiles and tests.
on:
  pull_request:
  push:
    branches: [main, "feat/**"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pagel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # Phase 0: a real Android runtime opens the APK. Unit tests cannot see a crash at launch, a frozen first frame
  # or a broken manifest; this can.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pagel-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # ReactiveCircus/android-emulator-runner: ★1.3k, Apache-2.0, release v2.38.0 (2026-07), vetted 2026-10-27.
      - name: Emulator smoke (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-smoke.sh
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: smoke-out/
          retention-days: 7
