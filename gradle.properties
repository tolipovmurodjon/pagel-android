# Run the Kotlin compiler IN-PROCESS (inside the Gradle daemon) instead of spawning a separate
# Kotlin compile daemon. This eliminates "Kotlin daemon terminated unexpectedly (error code 0)"
# entirely — there is no separate daemon to die. Slightly slower warm builds; rock-solid.
# Revert by removing the line below once the environment is stable.
kotlin.compiler.execution.strategy=in-process

# Larger heap + metaspace so the in-process compiler has room.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
